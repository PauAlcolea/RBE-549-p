# =============================================================================
# EinsteinVision — Team 3 master config
# All hardcoded paths and hyperparameters live here.
# Import with: from utils.io_utils import load_config; cfg = load_config()
# =============================================================================

# ── Sequences ──────────────────────────────────────────────────────────────
sequences:
  - scene1
  - scene2
  - scene3
  - scene4
  - scene5
  - scene6
  - scene7
  - scene8
  - scene9
  - scene10
  - scene11
  - scene12
  - scene13

# ── Cameras ────────────────────────────────────────────────────────────────
# All four views produced by the car. These are the suffixes in the filename
# inside Undist/, e.g. 2023-02-14_11-04-07-front_undistort.mp4
cameras:
  - front
  - back
  - left_repeater
  - right_repeater

# ── Paths (relative to Code/) ──────────────────────────────────────────────
paths:
  data_dir:         ../Data
  sequences_dir:    ../Data/Sequences
  calib_dir:        ../Data/Calib
  assets_dir:       ../Data/Assets
  detections_dir:   ../Outputs/Detections   # JSON output from perception
  videos_dir:       ../Outputs/Videos       # Final rendered MP4s
  frames_dir:       ../Outputs/Frames       # Intermediate PNG frames

# ── Model weights (download separately, place in Code/weights/) ─────────────
weights:
  yolo:       weights/yolov9c.pt
  depth:      weights/depth_anything_v2_metric_vkitti_vitb.pth
  lanes:      weights/sam3.pt

# ── Perception settings ────────────────────────────────────────────────────
perception:
  # device: cuda          # cuda | cpu    # might not be needed because we specify it in main()
  batch_size: 1         # increase if GPU memory allows
  frame_skip: 1         # process every Nth frame (1 = every frame)

  yolo:
    confidence: 0.40
    iou_threshold: 0.45
    # COCO class IDs we care about for Phase 1
    # 0=person, 2=car, 3=motorcycle, 5=bus, 7=truck
    classes_phase1: [0, 2, 3, 5, 7]

  lanes:
    model: DART
    max_lanes: 8
    classes: ["white lane line", "yellow lane line"]
    confidence: 0.30
    nms: 0.40
    imgsz: 1008
    runtime: auto             # auto | trt | compile | pytorch
    compile_mode: max-autotune
    use_masks: true
    return_raw: true
    trt_max_classes: 4
    trt_backbone: perception/DART/hf_backbone_fp16.engine
    trt_enc_dec: perception/DART/enc_dec_fp16.engine
    text_cache: null
    polyline_points: 20
    color_samples: 12
    color_patch: 3
    white_vote_ratio: 0.5
    dash_gap_px: 60
    min_length_px: 60.0
    hsv_yellow_low: [15, 90, 70]
    hsv_yellow_high: [38, 255, 255]
    hsv_white_low: [0, 0, 160]
    hsv_white_high: [179, 80, 255]

  depth:
    model:
      encoder: vitb        # vits | vitb | vitl
      features: 128
      out_channels: [96, 192, 384, 768]
      max_depth: 80        

    download_url: "https://huggingface.co/depth-anything/Depth-Anything-V2-Metric-VKITTI-Base/resolve/main/depth_anything_v2_metric_vkitti_vitb.pth?download=true"
    # Scale normalization: use known real-world heights (meters)
    known_heights:
      car: 1.5
      person: 1.75
      stop_sign: 0.75

  traffic_light:
    # HSV ranges for color classification (H in [0,179] for OpenCV)
    hsv_red_low:    [0,   120, 70]
    hsv_red_high:   [10,  255, 255]
    hsv_red_low2:   [170, 120, 70]   # red wraps around hue=0
    hsv_red_high2:  [180, 255, 255]
    hsv_yellow_low: [15,  120, 70]
    hsv_yellow_high: [35,  255, 255]
    hsv_green_low:  [40,  120, 70]
    hsv_green_high: [90,  255, 255]

# ── Blender / render settings ──────────────────────────────────────────────
blender:
  executable: blender   # path to blender binary, or just 'blender' if on PATH
  fps: 30
  resolution: [1920, 1080]
  render_engine: CYCLES  # CYCLES | EEVEE
  samples: 32            # lower = faster; 32 is a reasonable Phase 1 default
  output_format: PNG

  camera:
    # Intrinsics from calibration — update after running calibration
    fx: 1000.0
    fy: 1000.0
    cx: 960.0
    cy: 540.0
    # Camera height above ground plane (meters, approximate)
    height_m: 1.2

  # Visual style for Tesla-like overlay
  style:
    lane_solid_white:  [1.0, 1.0, 1.0]   # RGB 0-1
    lane_dashed_white: [1.0, 1.0, 1.0]
    lane_solid_yellow: [1.0, 0.85, 0.0]
    lane_width: 0.15          # meters (rendered lane stripe width)
    car_color:   [0.2, 0.6, 1.0]
    ped_color:   [0.1, 0.9, 0.4]
    light_red:   [1.0, 0.15, 0.1]
    light_yellow: [1.0, 0.85, 0.0]
    light_green: [0.1, 0.9, 0.2]
