# =============================================================================
# EinsteinVision — Team 3 master config
# All hardcoded paths and hyperparameters live here.
# Import with: from utils.io_utils import load_config; cfg = load_config()
# =============================================================================

# ── Sequences ──────────────────────────────────────────────────────────────
sequences:
  - scene1
  - scene2
  - scene3
  - scene4
  - scene5
  - scene6
  - scene7
  - scene8
  - scene9
  - scene10
  - scene11
  - scene12
  - scene13

# ── Cameras ────────────────────────────────────────────────────────────────
# All four views produced by the car. These are the suffixes in the filename
# inside Undist/, e.g. 2023-02-14_11-04-07-front_undistort.mp4
cameras:
  - front
  - back
  - left_repeater
  - right_repeater

# ── Paths (relative to Code/) ──────────────────────────────────────────────
paths:
  data_dir:         ../Data
  sequences_dir:    ../Data/Sequences
  calib_dir:        ../Data/Calib
  assets_dir:       ../Data/Assets
  detections_dir:   ../Outputs/Detections   # JSON output from perception
  videos_dir:       ../Outputs/Videos       # Final rendered MP4s
  frames_dir:       ../Outputs/Frames       # Intermediate PNG frames

# ── Model weights (download separately, place in Code/../Weights/) ─────────────
weights:
  yolo:         ../Weights/yolov9c.pt
  rtdetr:       ../Weights/rtdetr-x.pt      # download: ultralytics rtdetr-x (COCO pretrained)
  depth:        ../Weights/depth_anything_v2_metric_vkitti_vitb.pth
  lanes:        ../Weights/sam3.pt
  orientation:  ../Weights/boundingbox.pkl

# ── Perception settings ────────────────────────────────────────────────────
perception:
  # device: cuda          # cuda | cpu    # might not be needed because we specify it in main()
  batch_size: 1         # increase if GPU memory allows
  frame_skip: 30         # process every Nth frame (30 = every frame)

  yolo:
    confidence: 0.25    # low on purpose
    iou_threshold: 0.45
    # COCO class IDs we care about for Phase 1
    # 0=person, 1=bicycle, 2=car, 3=motorcycle, 5=bus, 7=truck, 9=traffic light, 11=stop sign
    classes_phase1: [0, 1, 2, 3, 5, 7, 9, 11]
  
  rtdetr:
    confidence: 0.25          # also low — merged threshold does the real gating
    iou_threshold: 0.45
    match_iou: 0.50           # IoU needed between a YOLO and RT-DETR box to count as same object
                              # lower = more lenient matching (good for large/truncated objects)
                              # higher = stricter spatial agreement required
    merged_confidence: 0.65   # final gate: average of both scores must exceed this (0.65 if too many false positives, 0.45 if missing too many real objects)

  lanes:
    model: DART
    max_lanes: 8
    classes: ["white lane line", "yellow lane line"]
    confidence: 0.30
    nms: 0.40
    imgsz: 1008
    runtime: auto             # auto | trt | compile | pytorch
    compile_mode: max-autotune
    use_masks: true
    return_raw: true
    trt_max_classes: 4
    trt_backbone: perception/DART/hf_backbone_fp16.engine
    trt_enc_dec: perception/DART/enc_dec_fp16.engine
    text_cache: null
    polyline_points: 20
    color_samples: 12
    color_patch: 3
    white_vote_ratio: 0.5
    dash_gap_px: 60
    min_length_px: 60.0
    hsv_yellow_low: [15, 90, 70]
    hsv_yellow_high: [38, 255, 255]
    hsv_white_low: [0, 0, 160]
    hsv_white_high: [179, 80, 255]

  non_coco_dart:
    enabled: true
    model: DART
    object_list: ["traffic_cones", "trash_cans", "traffic_poles", "speed_limit_signs"]
    classes:
    - prompt: "traffic cone"
      label: "traffic_cone"
      export_bucket: "traffic_cones"
    - prompt: "traffic cylinder"
      label: "traffic_cone"
      export_bucket: "traffic_cones"
    - prompt: "garbage can"
      label: "trash_can"
      export_bucket: "trash_cans"
    - prompt: "bollard"
      label: "traffic_pole"
      export_bucket: "traffic_poles"
      exclude_labels: ["traffic_cone"]
    - prompt: "speed limit sign"
      label: "speed_limit_sign"
      export_bucket: "speed_limit_signs"
    default_export_bucket: "non_coco_objects"
    negative_overlap_iou: 0.35   # suppress a class if it overlaps an excluded class at/above this IoU
    confidence: 0.35
    nms: 0.40
    imgsz: 1008
    runtime: auto             # auto | trt | compile | pytorch
    compile_mode: max-autotune
    use_masks: true
    trt_max_classes: 4
    trt_backbone: perception/DART/hf_backbone_fp16.engine
    trt_enc_dec: perception/DART/enc_dec_fp16.engine
    text_cache: null
    min_width_px: 8
    min_height_px: 8
    max_instances: 30

  vehicle_subtypes_dart:
    enabled: true
    model: DART
    target_labels: ["car", "truck"]
    allowed_matches:
      car: ["suv", "pickuptruck", "sedan", "hatchback"]
      truck: ["pickuptruck"]
    classes:
    - prompt: "sport utility vehicle"
      label: "suv"
    - prompt: "pickup truck"
      label: "pickuptruck"
    - prompt: "sedan"
      label: "sedan"
    - prompt: "hatchback"
      label: "hatchback"
    default_export_bucket: "vehicle_subtypes"
    confidence: 0.60  #this number is higher so that trucks don't get classified as pickups so easily
    nms: 0.40
    imgsz: 1008
    runtime: auto
    compile_mode: max-autotune
    use_masks: false
    trt_max_classes: 4
    trt_backbone: perception/DART/hf_backbone_fp16.engine
    trt_enc_dec: perception/DART/enc_dec_fp16.engine
    text_cache: null
    min_width_px: 16
    min_height_px: 16
    max_instances: 40
    match_iou: 0.50

  speed_limit_ocr:
    enabled: true
    lang_list: ["en"]
    min_confidence: 0.5
    min_speed_mph: 25
    max_speed_mph: 120
    allowlist: "0123456789"
    gpu: true
    padding_ratio: 0.05
    min_crop_size: 24
    debug_save: true
    download_enabled: true

  depth:
    model:
      encoder: vitb        # vits | vitb | vitl
      features: 128
      out_channels: [96, 192, 384, 768]
      max_depth: 80        

    download_url: "https://huggingface.co/depth-anything/Depth-Anything-V2-Metric-VKITTI-Base/resolve/main/depth_anything_v2_metric_vkitti_vitb.pth?download=true"
    # Scale normalization: use known real-world heights (meters)
    known_heights:
      car: 1.5
      sedan: 1.45
      hatchback: 1.5
      suv: 1.75
      pickuptruck: 1.8
      pickup_truck: 1.8
      person: 1.75
      stop_sign: 0.75
      traffic_light: 5
      traffic_cone: 0.7
      trash_can: 1.0
      traffic_pole: 3.0
      speed_limit_sign: 0.6

  traffic_light:
    force_best_guess: true        # if true, return top-scoring state unless score is degenerate
    # HSV ranges for color classification (H in [0,179] for OpenCV)
    hsv_red_low:    [0,   120, 70]
    hsv_red_high:   [10,  255, 255]
    hsv_red_low2:   [170, 120, 70]   # red wraps around hue=0
    hsv_red_high2:  [180, 255, 255]
    hsv_yellow_low: [15,  120, 70]
    hsv_yellow_high: [35,  255, 255]
    hsv_green_low:  [40,  120, 70]
    hsv_green_high: [90,  255, 255]

    # region_on classifier tuning
    region_margin_ratio: 0.08       # ignore border pixels in bbox crop
    center_focus_ratio: 0.6         # keep only center columns (suppresses side glare/clutter)
    bulb_roi_radius_ratio: 0.33     # ROI radius as fraction of one-third light height
    on_v_percentile: 60.0           # adaptive value threshold percentile per region
    min_on_v: 100.0                 # lower bound for "bright enough"
    min_on_s: 45.0                  # lower bound for "colored enough"
    unknown_score_epsilon: 0.02     # used only when force_best_guess is false
    degenerate_score_epsilon: 0.00001  # always unknown when all region scores are tiny
    weight_bright_ratio: 0.35
    weight_sv_energy: 0.55
    weight_contrast: 0.35
    weight_color_prior: 0.01
    reject_if_hsv_comparable: true  # emit unknown when all 3 ROIs have similar HSV statistics
    comparable_hue_range_max: 12.0  # OpenCV hue units in [0, 179]
    comparable_sat_range_max: 30.0
    comparable_val_range_max: 35.0
    hue_compare_min_s: 35.0          # ignore near-gray pixels for hue mean
    hue_compare_min_v: 35.0          # ignore very dark pixels for hue mean

  stop_sign:
    min_contour_area: 800       # fallback: ignore red shapes smaller than this (px²)
    max_contour_area: 40000     # fallback: ignore red shapes larger than this (px²)
    dp_epsilon_factor: 0.04     # Douglas-Peucker coarseness (fraction of perimeter)
    min_sides: 7                # tightened — rectangles approx to 4-6 sides
    max_sides: 9                # tightened — real octagons land in 7-9
    aspect_ratio_min: 0.70      # stop signs are nearly square
    aspect_ratio_max: 1.43      # inverse of 0.70 for symmetry
    min_solidity: 0.82          # contour area / convex hull area; filled octagon ~0.95
    fallback_confidence: 0.50
    fallback_window_frames: 10  # how many frames after a YOLO sighting to keep fallback active

# ── Blender / render settings ──────────────────────────────────────────────
blender:
  executable: blender   # path to blender binary, or just 'blender' if on PATH
  fps: 30
  resolution: [1280, 960]
  render_engine: CYCLES  # CYCLES | EEVEE
  samples: 32            # lower = faster; 32 is a reasonable Phase 1 default
  output_format: PNG
  ground_clearance_m: 0.03

  camera:
    # Intrinsics from calibration -- automatically updated with calibration
    fx: 1600.327787
    fy: 1613.801735 
    cx: 637.482852
    cy: 424.546778
    height_m: 1.2

  # Visual style for Tesla-like overlay
  style:
    lane_solid_white:  [1.0, 1.0, 1.0]   # RGB 0-1
    lane_solid_yellow: [1.0, 0.85, 0.0]
    lane_width: 0.15          # meters (rendered lane stripe width)
    car_color:   [0.2, 0.6, 1.0]
    ped_color:   [0.1, 0.9, 0.4]
    light_red:   [1.0, 0.15, 0.1]
    light_yellow: [1.0, 0.85, 0.0]
    light_green: [0.1, 0.9, 0.2]

    speed_limit_uv:
      u_offset: 0.0
      v_offset: 0.0
      rotation_deg: 0.0
      u_scale: 1.0
      v_scale: 1.0

    speed_limit_text:
      font_scale: 0.40   # larger digits for readability at distance
      y_ratio: 0.69      # place text in the blank lower panel of sign face
      text_color: [0, 0, 0]
      stroke_width: 4
      stroke_color: [255, 255, 255]
