# =============================================================================
# EinsteinVision — Team 3 master config
# All hardcoded paths and hyperparameters live here.
# Import with: from utils.io_utils import load_config; cfg = load_config()
# =============================================================================

# ── Sequences ──────────────────────────────────────────────────────────────
sequences:
  - scene1
  - scene2
  - scene3
  - scene4
  - scene5
  - scene6
  - scene7
  - scene8
  - scene9
  - scene10
  - scene11
  - scene12
  - scene13

# ── Cameras ────────────────────────────────────────────────────────────────
# All four views produced by the car. These are the suffixes in the filename
# inside Undist/, e.g. 2023-02-14_11-04-07-front_undistort.mp4
cameras:
  - front
  - back
  - left_repeater
  - right_repeater

# ── Paths (relative to Code/) ──────────────────────────────────────────────
paths:
  data_dir:         ../Data
  sequences_dir:    ../Data/Sequences
  calib_dir:        ../Data/Calib
  assets_dir:       ../Data/Assets
  detections_dir:   ../Outputs/Detections   # JSON output from perception
  videos_dir:       ../Outputs/Videos       # Final rendered MP4s
  frames_dir:       ../Outputs/Frames       # Intermediate PNG frames

# ── Model weights (download separately, place in Code/../Weights/) ─────────────
weights:
  yolo:         ../Weights/yolov9c.pt
  rtdetr:       ../Weights/rtdetr-x.pt      # download: ultralytics rtdetr-x (COCO pretrained)
  depth:        ../Weights/depth_anything_v2_metric_vkitti_vitl.pth
  lanes:        ../Weights/sam3.pt
  orientation:  ../Weights/boundingbox.pkl
  pymaf:        ../Weights/PyMAF_model_checkpoint.pt
  flow:         ../Weights/FA-C-T-Mixed-TSKH432x960.pth

# ── Perception settings ────────────────────────────────────────────────────
perception:
  # device: cuda          # cuda | cpu    # might not be needed because we specify it in main()
  batch_size: 1         # increase if GPU memory allows
  frame_skip: 5         # process every Nth frame (30 = every frame)

  yolo:
    confidence: 0.25    # low on purpose
    iou_threshold: 0.45
    # COCO class IDs we care about for Phase 1
    # 0=person, 1=bicycle, 2=car, 3=motorcycle, 5=bus, 7=truck, 9=traffic light, 11=stop sign
    classes_phase1: [0, 1, 2, 3, 5, 7, 9, 11]
  
  rtdetr:
    confidence: 0.25          # also low — merged threshold does the real gating
    iou_threshold: 0.45
    match_iou: 0.50           # IoU needed between a YOLO and RT-DETR box to count as same object
                              # lower = more lenient matching (good for large/truncated objects)
                              # higher = stricter spatial agreement required
    merged_confidence: 0.65   # final gate: average of both scores must exceed this (0.65 if too many false positives, 0.45 if missing too many real objects)

  tracker:
    enabled: true
    track_objects: true
    track_non_coco: true
    track_thresh: 0.5
    match_thresh: 0.5
    second_match_thresh: 0.4
    lost_match_thresh: 0.3
    max_time_lost: 30
    min_hits: 3
    duplicate_iou_thresh: 0.85
    class_agnostic_nms_thresh: 1.0
    assignment_iou: 0.10
    project_to_specialized_iou: 0.20
    include_labels: []
    exclude_labels: []

  temporal_stability:
    enabled: true

    class_smoothing:
      enabled: true
      window_size: 5
      hysteresis_frames: 2
      min_vote_ratio: 0.5
      confidence_margin: 0.08
      restrict_to_groups: true
      groups:
        vehicle_family: ["car", "sedan", "hatchback", "suv", "pickuptruck", "pickup_truck", "truck", "bus"]
        two_wheeler_family: ["bicycle", "motorcycle"]

    heading_smoothing:
      enabled: true
      all_with_heading: true
      ema_alpha: 0.45
      max_delta_deg: 30.0

    missing_frame_hold:
      enabled: true
      max_frames: 2
      confidence_decay: 0.9
      cleanup_after_frames: 20

  lanes:
    model: DART
    max_lanes: 8
    classes: ["yellow lane line on road", "white lane line on road", "crosswalk marking on road"]
    confidence: 0.30
    nms: 0.40
    imgsz: 1008
    runtime: auto             # auto | trt | compile | pytorch
    compile_mode: max-autotune
    use_masks: true
    return_raw: true
    trt_max_classes: 4
    trt_backbone: perception/DART/hf_backbone_fp16.engine
    trt_enc_dec: perception/DART/enc_dec_fp16.engine
    text_cache: null
    polyline_points: 20
    polyline_component_filter_enabled: true
    polyline_component_min_area: 20
    polyline_x_track_nearest: true
    polyline_smooth_window: 5
    polyline_mask_close_kernel: 3
    polyline_mask_close_iters: 1
    polyline_spike_filter_enabled: true
    polyline_spike_turn_deg: 65.0
    polyline_spike_segment_ratio: 2.0
    polyline_spike_deviation_ratio: 1.3
    polyline_spike_max_removed_ratio: 0.45
    polyline_spike_min_points: 6
    polyline_straighten_enabled: true
    polyline_straighten_min_points: 6
    polyline_straighten_max_median_residual_px: 1.5
    polyline_straighten_max_residual_px: 6.0
    color_samples: 12
    color_patch: 3
    white_vote_ratio: 0.5
    min_length_px: 40.0
    suppress_on_crosswalk_marking: true
    crosswalk_suppress_min_confidence: 0.85
    crosswalk_suppress_pad_px: 0.0
    crosswalk_suppress_min_points: 6
    crosswalk_suppress_point_ratio: 0.45
    export_min_confidence: 0.85
    export_min_confidence_yellow: 0.65
    export_min_confidence_white: 0.85
    debug_draw_unmatched_raw_boxes: true
    debug_show_drop_reasons: true
    debug_raw_match_pad_px: 6.0
    debug_raw_match_min_points: 2
    debug_raw_match_point_ratio: 0.10
    hsv_yellow_low: [15, 90, 70]
    hsv_yellow_high: [38, 255, 255]
    hsv_white_low: [0, 0, 160]
    hsv_white_high: [179, 80, 255]

  non_coco_dart:
    enabled: true
    model: DART
    object_list: ["traffic_cones", "trash_cans", "traffic_poles", "speed_limit_signs", "ground_arrows", "ground_text_markings"]
    classes:
    - prompt: "traffic cone"
      label: "traffic_cone"
      export_bucket: "traffic_cones"
      exclude_labels: ["fire_hydrant"]
    - prompt: "fire hydrant"
      label: "fire_hydrant"
      export_bucket: "non_coco_objects"
      exclude_labels: ["traffic_cone"]
    - prompt: "traffic cylinder"
      label: "traffic_cone"
      export_bucket: "traffic_cones"
    - prompt: "garbage can"
      label: "trash_can"
      export_bucket: "trash_cans"
    - prompt: "bollard on road"
      label: "traffic_pole"
      export_bucket: "traffic_poles"
      exclude_labels: ["traffic_cone"] # "fence post" effective for scene11
    - prompt: "speed limit sign"
      label: "speed_limit_sign"
      export_bucket: "speed_limit_signs"
    - prompt: "white directional arrow painted on road"
      label: "ground_arrow"
      export_bucket: "ground_arrows"
      exclude_labels: ["metal sign next to road with arrow shape", "lettering painted on road"]
    - prompt: "triangle painted on road"
      label: "ground_arrow"
      export_bucket: "ground_arrows"
      exclude_labels: ["triangle metal sign next to road"]
    - prompt: "lettering painted on road"
      label: "ground_text"
      export_bucket: "ground_text_markings"
      exclude_labels: ["crosswalk marking", "text on metal sign next to road", "text painted on car", "ground_arrow"]
    - prompt: "overhead lane control signal with red X or green arrow above highway lane"
      label: "lane_control_light"
      export_bucket: "non_coco_objects"
      exclude_labels: ["car turn signal", "tunnel ceiling lights", "car headlight", "car taillight"]
    default_export_bucket: "non_coco_objects"
    negative_overlap_iou: 0.35   # suppress a class if it overlaps an excluded class at/above this IoU
    confidence: 0.35
    nms: 0.40
    imgsz: 1008
    runtime: auto             # auto | trt | compile | pytorch
    compile_mode: max-autotune
    use_masks: true
    trt_max_classes: 4
    trt_backbone: perception/DART/hf_backbone_fp16.engine
    trt_enc_dec: perception/DART/enc_dec_fp16.engine
    text_cache: null
    min_width_px: 8
    min_height_px: 8
    max_instances: 30
    ground_arrow_min_center_y_ratio: 0.5
    ground_arrow_min_bottom_y_ratio: 0.55
    ground_text_dedupe_enabled: true
    ground_text_dedupe_iou: 0.05
    ground_text_dedupe_ioa: 0.25
    ground_text_merge_enabled: true
    ground_text_merge_max_gap_ratio: 1.8
    ground_text_merge_y_center_tol_ratio: 0.9
    ground_text_merge_max_span_ratio: 7.0
    ground_text_merge_min_cluster_size: 2
    ground_arrow_text_overlap_iou: 0.01
    ground_arrow_text_overlap_ioa: 0.2

  vehicle_subtypes_dart:
    enabled: true
    model: DART
    target_labels: ["car", "truck"]
    allowed_matches:
      car: ["suv", "pickuptruck", "sedan", "hatchback"]
      truck: ["pickuptruck"]
    classes:
    - prompt: "sport utility vehicle"
      label: "suv"
    - prompt: "pickup truck"
      label: "pickuptruck"
    - prompt: "sedan"
      label: "sedan"
    - prompt: "hatchback"
      label: "hatchback"
    default_export_bucket: "vehicle_subtypes"
    confidence: 0.60  #this number is higher so that trucks don't get classified as pickups so easily
    nms: 0.40
    imgsz: 1008
    runtime: auto
    compile_mode: max-autotune
    use_masks: false
    trt_max_classes: 4
    trt_backbone: perception/DART/hf_backbone_fp16.engine
    trt_enc_dec: perception/DART/enc_dec_fp16.engine
    text_cache: null
    min_width_px: 16
    min_height_px: 16
    max_instances: 40
    match_iou: 0.50

  speed_limit_ocr:
    enabled: true
    lang_list: ["en"]
    min_confidence: 0.5
    min_speed_mph: 25
    max_speed_mph: 120
    allowlist: "0123456789"
    gpu: true
    padding_ratio: 0.05
    min_crop_size: 24
    debug_save: true
    download_enabled: true

  depth:
    model:
      encoder: vitl        # vits | vitb | vitl
      features: 256
      out_channels: [256, 512, 1024, 1024]
      max_depth: 80        

    download_url: "https://huggingface.co/depth-anything/Depth-Anything-V2-Metric-VKITTI-Large/resolve/main/depth_anything_v2_metric_vkitti_vitl.pth?download=true"
    # Scale normalization: use known real-world heights (meters)
    known_heights:
      car: 1.5
      sedan: 1.45
      hatchback: 1.5
      suv: 1.75
      pickuptruck: 1.8
      pickup_truck: 1.8
      person: 1.75
      stop_sign: 0.75
      traffic_light: 5
      traffic_cone: 0.7
      trash_can: 1.0
      traffic_pole: 0.9
      speed_limit_sign: 0.6

  pymaf:
    enabled: true
    repo_dir: perception/PyMAF
    checkpoint: ../Weights/PyMAF_model_checkpoint.pt
    smpl_fallback_pkl: ../Weights/pymaf_male.pkl
    output_dir: ../Outputs/PyMAF
    cfg_file: configs/pymaf_config.yaml
    python_exec: python3
    detector: yolov8           # yolo | maskrcnn | yolov3 | yolov8
    tracking_method: bbox      # bbox | pose
    yolo_img_size: 416
    tracker_batch_size: 12
    model_batch_size: 8
    no_render: true
    reuse_cache: true
    match_iou: 0.20            # IoU threshold to map PyMAF track bboxes to our person detections
    min_bbox_side_px: 20.0     # ignore tiny person boxes when attaching SMPL fields
    include_joints3d: true
    strict_assets: false       # if true, fail hard when required PyMAF files are missing

  traffic_light:
    force_best_guess: true        # if true, return top-scoring state unless score is degenerate
    # HSV ranges for color classification (H in [0,179] for OpenCV)
    hsv_red_low:    [0,   120, 70]
    hsv_red_high:   [10,  255, 255]
    hsv_red_low2:   [170, 120, 70]   # red wraps around hue=0
    hsv_red_high2:  [180, 255, 255]
    hsv_yellow_low: [15,  120, 70]
    hsv_yellow_high: [35,  255, 255]
    hsv_green_low:  [40,  120, 70]
    hsv_green_high: [90,  255, 255]

    # region_on classifier tuning
    region_margin_ratio: 0.08       # ignore border pixels in bbox crop
    center_focus_ratio: 0.6         # keep only center columns (suppresses side glare/clutter)
    bulb_roi_radius_ratio: 0.33     # ROI radius as fraction of one-third light height
    on_v_percentile: 60.0           # adaptive value threshold percentile per region
    min_on_v: 100.0                 # lower bound for "bright enough"
    min_on_s: 45.0                  # lower bound for "colored enough"
    unknown_score_epsilon: 0.02     # used only when force_best_guess is false
    degenerate_score_epsilon: 0.00001  # always unknown when all region scores are tiny
    weight_bright_ratio: 0.35
    weight_sv_energy: 0.55
    weight_contrast: 0.35
    weight_color_prior: 0.01
    reject_if_hsv_comparable: true  # emit unknown when all 3 ROIs have similar HSV statistics
    comparable_hue_range_max: 12.0  # OpenCV hue units in [0, 179]
    comparable_sat_range_max: 30.0
    comparable_val_range_max: 35.0
    hue_compare_min_s: 35.0          # ignore near-gray pixels for hue mean
    hue_compare_min_v: 35.0          # ignore very dark pixels for hue mean
    square_arrow_aspect_min: 0.75    # near-square lower aspect bound for lone arrow/X signals
    square_arrow_aspect_max: 1.35    # near-square upper aspect bound
    square_arrow_max_area_ratio: 0.008  # max bbox area/image area for these small lane-control heads
    square_arrow_prior_weight: 0.40  # side prior weight: greener on right side, redder on left
    square_arrow_bluegreen_hue_center_deg: 176.0  # green-arrow hue can drift blue/cyan (degrees)
    square_arrow_bluegreen_hue_half_width_deg: 26.0
    square_arrow_bluegreen_min_v: 170.0
    square_arrow_bluegreen_max_s: 110.0
    square_arrow_bluegreen_weight: 0.9
    square_arrow_red_dark_max_v: 95.0   # red X can be very dark
    square_arrow_red_dark_min_s: 20.0   # keep dark background from being counted as red evidence
    square_arrow_red_dark_weight: 0.55
    dart_lane_control_enabled: true
    dart_lane_control_min_confidence: 0.30
    dart_lane_control_dedupe_iou: 0.45
    nested_overlap_ioa: 0.80             # generic containment suppression for nested whole-light/arrow boxes

  stop_sign:
    min_contour_area: 800       # fallback: ignore red shapes smaller than this (px²)
    max_contour_area: 40000     # fallback: ignore red shapes larger than this (px²)
    dp_epsilon_factor: 0.04     # Douglas-Peucker coarseness (fraction of perimeter)
    min_sides: 7                # tightened — rectangles approx to 4-6 sides
    max_sides: 9                # tightened — real octagons land in 7-9
    aspect_ratio_min: 0.70      # stop signs are nearly square
    aspect_ratio_max: 1.43      # inverse of 0.70 for symmetry
    min_solidity: 0.82          # contour area / convex hull area; filled octagon ~0.95
    fallback_confidence: 0.50
    fallback_window_frames: 10  # how many frames after a YOLO sighting to keep fallback active

# ── Blender / render settings ──────────────────────────────────────────────
blender:
  executable: blender   # path to blender binary, or just 'blender' if on PATH
  fps: 30
  resolution: [1280, 960]
  render_engine: CYCLES  # CYCLES | EEVEE
  samples: 32            # lower = faster; 32 is a reasonable Phase 1 default
  output_format: PNG
  ground_clearance_m: 0.03
  pedestrian:
    mode: smpl_mesh          # was: pymaf (skeleton) | asset (generic mesh)
    smpl_pkl: "../Weights/SMPL_NEUTRAL.pkl"   # path to your SMPL neutral model
    pymaf_target_height_m: 1.70
    pymaf_reuse_previous_on_failure: true   # if current frame PyMAF is invalid, reuse last valid track pose
    pymaf_allow_asset_fallback: false       # disable legacy pedestrian asset fallback
    pymaf_pose_guard_enabled: true                # reject drastic pose changes; reuse previous valid tracked pose
    pymaf_pose_guard_soft_joint_delta_rad: 0.65  # "large" per-joint rotation change threshold
    pymaf_pose_guard_soft_joint_count: 2         # require this many large-jump joints for soft guard trigger
    pymaf_pose_guard_soft_max_joint_delta_rad: 0.80   # and max joint delta must also exceed this
    pymaf_pose_guard_hard_joint_delta_rad: 1.20  # any joint above this is immediately rejected
    pymaf_pose_guard_root_delta_rad: 0.80        # root orientation jump guard
    pymaf_pose_clamp_enabled: false              # optional extra smoothing (off by default; guard is safer)
    pymaf_pose_max_joint_delta_rad: 0.40         # used only when pymaf_pose_clamp_enabled=true
    pymaf_pose_hold_max_fallback_frames: 3  # only during fallback: reuse same pose for up to N consecutive frames
    pymaf_upright_hysteresis: 0.15          # deadband around upright score to avoid jitter flips
    pymaf_flip_confirm_frames: 2            # require N consistent frames before orientation flip
    # skeleton-mode settings below still apply as fallback
    pymaf_bone_radius_m: 0.018
    pymaf_joint_radius_m: 0.025
    pymaf_min_joint_count: 24
    pymaf_use_last24: true
    pymaf_y_up: true          # PyMAF joints are generally y-up in local body space

  camera:
    mode: third_person   # first_person | third_person
    # Intrinsics from calibration -- automatically updated with calibration
    fx: 1600.327787
    fy: 1613.801735 
    cx: 637.482852
    cy: 424.546778
    height_m: 1.2
    chase_offset:
      behind_m: 14.0 # how far behind the car the camera should be
      right_m: 0.0
      up_m: 4.0 # higher = more top-down view
    follow_ego_heading: true
    fixed_heading_rad: 0.0
    look_ahead_m: 10.0 # how far ahead of tesla the camera should look
    look_at_height_m: 1.0

  ego_vehicle:
    asset: tesla
    location: [0.0, 0.0, 0.0]
    yaw_rad: 0.0
    asset_yaw_offset_rad: 3.141592653589793
    scale: [0.9, 0.9, 0.9]

  motion_state:
    enabled: true
    history_frames: 5
    min_history_frames: 3
    ema_alpha: 0.35
    jitter_speed_mps: 0.20
    moving_speed_mps: 0.70
    parked_speed_mps: 0.35
    move_confirm_frames: 3
    park_confirm_frames: 4
    min_forward_mps: 0.15
    lateral_min_mps: 0.25
    max_lateral_to_forward_ratio: 1.2
    max_unseen_frames: 20
    anon_assoc_max_dist_m: 1.6
    debug: false

  vehicle_dedupe:
    enabled: true
    max_xy_dist_m: 0.85      # treat vehicles within this planar distance as duplicates
    max_depth_delta_m: 2.5   # and with small vertical/depth mismatch
    bbox_iou_thresh: 0.92    # also dedupe near-identical 2D boxes

  # Visual style for Tesla-like overlay
  style:
    lane_solid_white:  [1.0, 1.0, 1.0]
    lane_solid_yellow: [1.0, 0.85, 0.0]
    ego_paint_rgb: [0.80, 0.06, 0.08]
    ego_tesla_style_enabled: true
    ego_tesla_top_glass_rgb: [0.02, 0.02, 0.02]
    ego_tesla_top_glass_alpha: 0.28
    ego_tesla_top_glass_transmission: 0.90
    ego_tesla_trim_gray_rgb: [0.58, 0.58, 0.58]
    ego_tesla_logo_gray_rgb: [0.8, 0.8, 0.8]
    ego_tesla_part_material_tokens:
      top: side_window
      trunk.001: trim_gray
      trunk.002: trim_gray
      bumper: keep_red
      bumper.001: trim_gray
      bumper.002: trim_gray
      bumper.003: trim_gray
      bumper.004: trim_gray
      bumper.005: trim_gray
      logo_text: logo_gray
      logo text: logo_gray
      logo: logo_gray
    lane_width: 0.15          # meters (rendered lane stripe width)
    car_color:   [0.2, 0.6, 1.0]
    vehicle_motion_tint_color: [0.95, 0.82, 0.20]
    vehicle_motion_tint_metallic: 0.12
    vehicle_motion_tint_roughness: 0.35
    ped_color:   [0.1, 0.9, 0.4]
    light_red:   [1.0, 0.15, 0.1]
    light_yellow: [1.0, 0.85, 0.0]
    light_green: [0.1, 0.9, 0.2]

    speed_limit_uv:
      u_offset: 0.0
      v_offset: 0.0
      rotation_deg: 0.0
      u_scale: 1.0
      v_scale: 1.0

    speed_limit_text:
      font_scale: 0.40   # larger digits for readability at distance
      y_ratio: 0.69      # place text in the blank lower panel of sign face
      text_color: [0, 0, 0]
      stroke_width: 4
      stroke_color: [255, 255, 255]
